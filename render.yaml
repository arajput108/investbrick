# Render Blueprint: one web service (free plan: US$0, sleeps when idle). Create it from the Render dashboard: New > Blueprint > pick your repo.
# Secrets are NOT stored here (sync: false means Render asks you for them in the dashboard).
services:
  - type: web
    name: investbrick
    runtime: node
    plan: free                    # US$0. The free plan SLEEPS after ~15 idle minutes, so the background matcher (and limit-order fills) pause while asleep. For reliable matching change this to `starter` (paid).
    region: singapore             # closest Render region to India; change if you prefer
    buildCommand: npm ci --omit=dev
    startCommand: node server/index.js
    healthCheckPath: /healthz     # does not touch the database, so it never keeps Neon awake
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: NODE_VERSION
        value: "22"             # quoted: Render expects every env value to be text
      - key: TRUST_PROXY
        value: "1"
      - key: DB_DRIVER
        value: pg
      # EMAIL_PROVIDER is not set: with BREVO_API_KEY present the server uses the Brevo API (HTTPS), else SMTP if SMTP_HOST is present; with neither, password reset reports itself as unavailable.
      # Never put API keys in this file: add BREVO_API_KEY and EMAIL_FROM in the Render dashboard (Environment tab). See .env.example.
      - key: DATABASE_URL         # Neon connection string (looks like postgresql://...neon.tech/...?sslmode=require)
        sync: false
      - key: APP_URL              # your public address, e.g. https://investbrick.onrender.com or https://www.yourdomain.com
        sync: false
      # OPTIONAL variables are deliberately not listed, so Render never insists on a value for them. Add them later in
      # Render > your service > Environment (see README): SMTP_HOST, SMTP_PORT, SMTP_USER, SMTP_PASS, EMAIL_FROM (password-reset email)
      # BREVO_API_KEY (free, HTTPS email that works on the free plan), CRON_SECRET (scheduled wake-up) and COINGECKO_API_KEY (free crypto-price key). Render's FREE plan blocks SMTP ports 25/465/587, so with Brevo use SMTP_PORT=2525.
